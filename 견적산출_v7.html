/* ── 헬퍼 컴포넌트 ── */
function Section({title,children}){return <div style={S.card}><div style={S.cardTitle}>{title}</div>{children}</div>;}
function SubTitle({c}){return <div style={S.subTitle}>{c}</div>;}
function Field({label,children}){return <div style={{display:"flex",flexDirection:"column",gap:4}}><label style={{fontSize:11,color:"#666",fontWeight:500}}>{label}</label>{children}</div>;}
function Inp({val,onChange,ph}){return <input style={S.input} type="number" value={val} onChange={e=>onChange(e.target.value)} placeholder={ph||""}/>;}
function CRow({label,val,hl}){return <div style={{display:"flex",justifyContent:"space-between",padding:"3px 0",borderBottom:"1px solid #1a1a1a"}}><span style={{color:"#555",fontSize:12}}>{label}</span><span style={{color:hl?"#E8A020":"#aaa",fontWeight:hl?700:400,fontSize:12}}>{val}</span></div>;}
function Total({label,val}){return <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",background:"#1a1200",border:"1px solid #E8A020",borderRadius:8,padding:"12px 16px",marginTop:12}}><span style={{color:"#E8A020",fontWeight:700,fontSize:13}}>{label}</span><span style={{color:"#fff",fontWeight:700,fontSize:17}}>{fmt(val)}원</span></div>;}
function RowHeader({idx,onRemove}){return <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}><span style={{color:"#E8A020",fontWeight:700,fontSize:12}}>#{idx+1}</span>{onRemove&&<button style={{background:"transparent",border:"none",color:"#444",fontSize:14,cursor:"pointer"}} onClick={onRemove}>✕</button>}</div>;}
function AddBtn({onClick,c}){return <button style={{background:"transparent",border:"1px dashed #2a2a2a",color:"#555",borderRadius:8,padding:"9px",fontSize:13,cursor:"pointer",width:"100%",marginTop:6}} onClick={onClick}>{c}</button>;}
function Btn({onClick,children}){return <button style={S.btnPrimary} onClick={onClick}>{children}</button>;}
function BtnSec({onClick,children}){return <button style={S.btnSecondary} onClick={onClick}>{children}</button>;}
function BtnRow({children}){return <div style={{display:"flex",gap:10,marginTop:16,justifyContent:"flex-end",flexWrap:"wrap"}}>{children}</div>;}
function AutoItem({label,val}){return <div style={{background:"#111",borderRadius:6,padding:"8px 10px"}}><div style={{color:"#666",fontSize:10,marginBottom:2}}>{label}</div><div style={{color:"#E8A020",fontWeight:700,fontSize:13}}>{val}</div></div>;}

/* ── 모드 토글 버튼 ── */
function ModeToggle({mode, onChange}){
  return (
    <div style={S.modeBar}>
      <button style={{...S.modeBtn,...(mode==="calc"?S.modeBtnOn:{})}} onClick={()=>onChange("calc")}>면적·수량 계산</button>
      <button style={{...S.modeBtn,...(mode==="direct"?S.modeBtnOn:{})}} onClick={()=>onChange("direct")}>금액 직접입력</button>
    </div>
  );
}

/* ── 직접입력 행 (공통) ── */
function DirectRow({row, updateRow, setter, onRemove, idx, label}){
  return (
    <div style={S.rowBox}>
      <RowHeader idx={idx} onRemove={onRemove}/>
      <ModeToggle mode={row.mode||"calc"} onChange={v=>updateRow(setter,row.id,"mode",v)}/>
      <div style={S.grid2}>
        <Field label={label||"항목명/위치"}><input style={S.input} value={row.label||""} onChange={e=>updateRow(setter,row.id,"label",e.target.value)} placeholder="예) 거실 바닥 필름"/></Field>
        <Field label="금액 (원)"><Inp val={row.directAmt} onChange={v=>updateRow(setter,row.id,"directAmt",v)} ph="0"/></Field>
      </div>
      {parseFloat(row.directAmt)>0 && <div style={{color:"#E8A020",fontWeight:700,fontSize:14,paddingTop:4}}>소계 {fmt(parseFloat(row.directAmt))}원</div>}
    </div>
  );
}

/* ── App ── */
function App(){
  const [step,         setStep]         = useState("info");
  const [autoApplied,  setAutoApplied]  = useState(false);
  const [marginRate,   setMarginRate]   = useState(0.25);
  const [savedList,    setSavedList]    = useState(loadSavedList());
  const [toast,        setToast]        = useState("");
  const [confirmDeleteId, setConfirmDeleteId] = useState(null);
  const [showSavedModal,  setShowSavedModal]  = useState(false);
  const fileInputRef = useRef(null);
  const [pin,          setPin]          = useState(()=>localStorage.getItem("mdw_pin_v7")||"");
  const [cloudList,    setCloudList]    = useState([]);
  const [cloudLoading, setCloudLoading] = useState(false);
  const [showPinModal, setShowPinModal] = useState(false);
  const [pinInput,     setPinInput]     = useState("");
  const [directSections, setDirectSections] = useState({protection:false,demolition:false,waste:false,window:false,plumbing:false,electric:false,plaster:false,sanitary:false,paint:false,furniture:false});
  const [directAmts,     setDirectAmts]     = useState({protection:"",demolition:"",waste:"",window:"",plumbing:"",electric:"",plaster:"",sanitary:"",paint:"",furniture:""});
  const setDS = (id,v) => setDirectSections(p=>({...p,[id]:v}));
  const setDA = (id,v) => setDirectAmts(p=>({...p,[id]:v}));
  const showToast = (msg) => { setToast(msg); setTimeout(()=>setToast(""), 2200); };

  const [siteInfo, setSiteInfo] = useState({
    name:"", type:"아파트", area:"", client:"",
    date:new Date().toISOString().slice(0,10), memo:"",
  });
  const [selectedTrades, setSelectedTrades] = useState([]);

  /* ── 공종별 state ── */
  const [protectRows,   setProtectRows]   = useState([
    {id:newId(),location:"엘리베이터",matId:"plywood",  qty:"1",unit:"식",customP:"200000"},
    {id:newId(),location:"복도·계단", matId:"cardboard",qty:"", unit:"m²",customP:""},
    {id:newId(),location:"실내 바닥", matId:"cardboard",qty:"", unit:"m²",customP:""},
  ]);
  const [demoRows,      setDemoRows]      = useState([{id:newId(),itemId:"floor",qty:"",customP:""}]);
  const [wasteRows,     setWasteRows]     = useState([{id:newId(),itemId:"mixed",qty:"",customP:""}]);
  const [windowRows,    setWindowRows]    = useState([{id:newId(),typeId:"pvc_double",label:"",qty:"",customP:""}]);
  const [plumbing,      setPlumbing]      = useState({hotLen:"",coldLen:"",drainLen:"",pipeMatP:20000,pipeInstP:35000,bathCount:"",kitchenCount:"",bathSetP:250000,kitchenSetP:200000,etcAmt:""});
  const [electric,      setElectric]      = useState({outlet:"",switch_:"",lighting:"",panel:"1",outletP:25000,switchP:20000,lightingP:35000,panelP:750000,outletInstP:35000,switchInstP:25000,lightingInstP:30000,etcAmt:""});
  const [plaster,       setPlaster]       = useState({area:"",matP:13000,instP:30000,etcAmt:""});
  const [carpentry,     setCarpentry]     = useState({
    ceilingArea:"",wallArea:"",partitionArea:"",
    ceilingP:50000,wallP:65000,partitionP:75000,
    moldingLen:"",moldingP:8000,moldingInstP:5000,
    baseLen:"",baseP:5000,baseInstP:6000,etcAmt:"",
    mode:"calc", directAmt:"",
  });
  const [tileRows,      setTileRows]      = useState([{id:newId(),space:"",location:"바닥",matId:"t300",area:"",customMatP:"",customInstP:"",mode:"calc",label:"",directAmt:""}]);
  const [sanitaryRows,  setSanitaryRows]  = useState([{id:newId(),itemId:"wc",qty:"1",customMatP:"",customInstP:""}]);
  const [floorRows,     setFloorRows]     = useState([{id:newId(),space:"",matId:"wood",area:"",customMatP:"",customInstP:"",mode:"calc",label:"",directAmt:""}]);
  const [paint,         setPaint]         = useState({wallArea:"",ceilingArea:"",wallCoat:"2",ceilingCoat:"2",puttyP:12000,paintMatP:8000,paintInstP:25000,ceilMatP:6000,ceilInstP:20000,etcAmt:""});
  const [filmRows,      setFilmRows]      = useState([{id:newId(),location:"",area:"",type:"일반시트",matP:15000,instP:18000,mode:"calc",label:"",directAmt:""}]);
  const [wallpaper,     setWallpaper]     = useState({wallTypeId:"silk",wallArea:"",ceilTypeId:"hanji",ceilingArea:"",wallInstP:13000,ceilInstP:10000,etcAmt:"",mode:"calc",directAmt:""});
  const [furnitureRows, setFurnitureRows] = useState([{id:newId(),itemId:"kitchen",qty:"1",customP:""}]);
  const [etcRows,       setEtcRows]       = useState([{id:newId(),memo:"",amt:""}]);

  /* ── 헬퍼 ── */
  const toggleTrade = (id) => setSelectedTrades(p=>p.includes(id)?p.filter(t=>t!==id):[...p,id]);
  const addRow  = (setter,tmpl) => setter(p=>[...p,{...tmpl,id:newId()}]);
  const removeRow = (setter,id) => setter(p=>p.filter(r=>r.id!==id));
  const updateRow = (setter,id,f,v) => setter(p=>p.map(r=>r.id===id?{...r,[f]:v}:r));

  /* ── 견적 저장/불러오기 ── */
  const buildSnapshot = () => ({
    siteInfo, selectedTrades, marginRate,
    protectRows, demoRows, wasteRows, windowRows, plumbing, electric, plaster, carpentry,
    tileRows, sanitaryRows, floorRows, paint, filmRows, wallpaper, furnitureRows, etcRows,
    directSections, directAmts,
  });
  const restoreSnapshot = (snap) => {
    if(!snap) return;
    if(snap.siteInfo)        setSiteInfo(snap.siteInfo);
    if(snap.selectedTrades)  setSelectedTrades(snap.selectedTrades);
    if(snap.marginRate!=null)setMarginRate(snap.marginRate);
    if(snap.protectRows)     setProtectRows(snap.protectRows);
    if(snap.demoRows)        setDemoRows(snap.demoRows);
    if(snap.wasteRows)       setWasteRows(snap.wasteRows);
    if(snap.windowRows)      setWindowRows(snap.windowRows);
    if(snap.plumbing)        setPlumbing(snap.plumbing);
    if(snap.electric)        setElectric(snap.electric);
    if(snap.plaster)         setPlaster(snap.plaster);
    if(snap.carpentry)       setCarpentry(snap.carpentry);
    if(snap.tileRows)        setTileRows(snap.tileRows);
    if(snap.sanitaryRows)    setSanitaryRows(snap.sanitaryRows);
    if(snap.floorRows)       setFloorRows(snap.floorRows);
    if(snap.paint)           setPaint(snap.paint);
    if(snap.filmRows)        setFilmRows(snap.filmRows);
    if(snap.wallpaper)       setWallpaper(snap.wallpaper);
    if(snap.furnitureRows)   setFurnitureRows(snap.furnitureRows);
    if(snap.etcRows)         setEtcRows(snap.etcRows);
    if(snap.directSections)  setDirectSections(snap.directSections);
    if(snap.directAmts)      setDirectAmts(snap.directAmts);
    setAutoApplied(true);
    setStep("detail");
  };
  const handleSaveToBrowser = () => {
    const name = siteInfo.name || "무제 견적";
    const entry = { id:newId(), name, client:siteInfo.client||"", savedAt:new Date().toISOString(), total:finalPrice, data:buildSnapshot() };
    const next = [entry, ...savedList].slice(0,50);
    setSavedList(next);
    saveSavedList(next);
    const currentPin = localStorage.getItem("mdw_pin_v7");
    if(currentPin) {
      db.collection("estimates").add({ pin:currentPin, name, client:siteInfo.client||"", savedAt:entry.savedAt, total:finalPrice, data:buildSnapshot() })
        .then(()=>showToast(`"${name}" 견적 저장 + ☁️ 클라우드 동기화 완료`))
        .catch(()=>showToast(`"${name}" 견적 저장 완료 (클라우드 오류)`));
    } else {
      showToast(`"${name}" 견적을 브라우저에 저장했습니다.`);
    }
  };
  const handleLoadFromCloud = async (pinCode) => {
    if(!pinCode || pinCode.length < 4) return;
    setCloudLoading(true);
    try {
      const snap = await db.collection("estimates").where("pin","==",pinCode).get();
      const items = snap.docs.map(d=>({cloudId:d.id, ...d.data()}))
        .sort((a,b)=>new Date(b.savedAt)-new Date(a.savedAt));
      setCloudList(items);
      localStorage.setItem("mdw_pin_v7", pinCode);
      setPin(pinCode);
      if(items.length===0) showToast("해당 PIN의 클라우드 저장 견적이 없습니다.");
      else showToast(`☁️ ${items.length}개 견적을 불러왔습니다.`);
    } catch(e) {
      showToast("클라우드 연결 오류: " + e.message);
    }
    setCloudLoading(false);
    setShowPinModal(false);
  };
  const handleDeleteCloud = async (cloudId) => {
    try {
      await db.collection("estimates").doc(cloudId).delete();
      setCloudList(prev=>prev.filter(e=>e.cloudId!==cloudId));
      showToast("클라우드 견적 삭제 완료");
    } catch(e) {
      showToast("삭제 오류: " + e.message);
    }
  };
  const handleDeleteSaved = (id) => {
    const next = savedList.filter(e=>e.id!==id);
    setSavedList(next);
    saveSavedList(next);
    setConfirmDeleteId(null);
  };
  const handleLoadSaved = (entry) => restoreSnapshot(entry.data);
  const handleExportFile = () => {
    const snap = buildSnapshot();
    const blob = new Blob([JSON.stringify(snap,null,2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const safeName = (siteInfo.name||"견적").replace(/[\\/:*?"<>|]/g,"_");
    a.href = url; a.download = `${safeName}_견적_${siteInfo.date||""}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };
  const handleImportFile = (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try{ restoreSnapshot(JSON.parse(ev.target.result)); showToast("파일에서 견적을 불러왔습니다."); }
      catch(err){ showToast("파일을 읽을 수 없습니다. 올바른 견적 JSON 파일인지 확인하세요."); }
    };
    reader.readAsText(file);
    e.target.value = "";
  };

  /* ── 자동계산 ── */
  const applyAutoCalc = () => {
    const area=parseFloat(siteInfo.area);
    if(!area){alert("총 면적을 먼저 입력하세요.");return;}
    const py=area/3.305;
    const s=AUTO_CALC[siteInfo.type]||AUTO_CALC["기타"];
    setFloorRows([
      {id:newId(),space:"마루/장판 구간",matId:"wood",    area:String(r1(area*s.floorWood)),customMatP:"",customInstP:"",mode:"calc",label:"",directAmt:""},
      {id:newId(),space:"타일 구간",     matId:"tile_600",area:String(r1(area*s.floorTile)),customMatP:"",customInstP:"",mode:"calc",label:"",directAmt:""},
    ]);
    setTileRows([
      {id:newId(),space:"바닥",location:"바닥",matId:"t300",area:String(r1(area*s.floorTile)),customMatP:"",customInstP:"",mode:"calc",label:"",directAmt:""},
      {id:newId(),space:"벽", location:"벽",  matId:"t300",area:String(r1(area*s.tileWall)), customMatP:"",customInstP:"",mode:"calc",label:"",directAmt:""},
    ]);
    setCarpentry(p=>({...p,ceilingArea:String(r1(area*s.ceilingCarp)),mode:"calc",directAmt:""}));
    setWallpaper(p=>({...p,wallArea:String(r1(area*s.wallpaper)),ceilingArea:String(r1(area*s.ceilingArea)),mode:"calc",directAmt:""}));
    setPaint(p=>({...p,wallArea:String(r1(area*s.paintWall)),ceilingArea:String(r1(area*s.ceilingArea))}));
    setWindowRows([{id:newId(),typeId:"pvc_double",label:"창호",qty:String(r0(py/s.windowPer)),customP:""}]);
    setElectric(p=>({...p,outlet:String(r0(py*s.outletPer)),switch_:String(r0(py*s.outletPer*0.5)),lighting:String(r0(py*s.lightingPer))}));
    setDemoRows([
      {id:newId(),itemId:"floor",  qty:String(r1(area*s.demoFloor)),  customP:""},
      {id:newId(),itemId:"wall",   qty:String(r1(area*s.demoWall)),   customP:""},
      {id:newId(),itemId:"ceiling",qty:String(r1(area*s.demoCeiling)),customP:""},
    ]);
    setWasteRows([{id:newId(),itemId:"mixed",qty:String(r1(area*s.wastePer)),customP:""}]);
    setProtectRows([
      {id:newId(),location:"엘리베이터",matId:"plywood",  qty:"1",             unit:"식",customP:"200000"},
      {id:newId(),location:"복도·계단", matId:"cardboard",qty:String(r1(py*2)),unit:"m²",customP:""},
      {id:newId(),location:"실내 바닥", matId:"cardboard",qty:String(r1(area)), unit:"m²",customP:""},
    ]);
    setSelectedTrades(["protection","demolition","waste","window","plumbing","electric","carpentry","tile","floor","wallpaper"]);
    setAutoApplied(true);
    setStep("detail");
  };

  /* ── 계산 함수 ── */
  const calcProtectRow = (row) => {
    const mat=PROTECT_MATS.find(m=>m.id===row.matId);
    if(!mat) return null;
    return {mat, unitP:parseFloat(row.customP)||mat.defP, qty:parseFloat(row.qty)||0, total:(parseFloat(row.customP)||mat.defP)*(parseFloat(row.qty)||0)};
  };
  const calcDemoRow  = (row) => { const i=DEMO_ITEMS.find(x=>x.id===row.itemId);  if(!i) return null; const p=parseFloat(row.customP)||i.defP,q=parseFloat(row.qty)||0; return {item:i,unitP:p,qty:q,total:p*q}; };
  const calcWasteRow = (row) => { const i=WASTE_ITEMS.find(x=>x.id===row.itemId); if(!i) return null; const p=parseFloat(row.customP)||i.defP,q=parseFloat(row.qty)||0; return {item:i,unitP:p,qty:q,total:p*q}; };
  const calcWindowRow= (row) => { const wt=WINDOW_TYPES.find(t=>t.id===row.typeId); const p=parseFloat(row.customP)||(wt?wt.defP:0),q=parseFloat(row.qty)||0; return {wt,unitP:p,qty:q,total:p*q}; };
  const calcPlumbing = () => {
    const len=(parseFloat(plumbing.hotLen)||0)+(parseFloat(plumbing.coldLen)||0)+(parseFloat(plumbing.drainLen)||0);
    const pipe=len*(parseFloat(plumbing.pipeMatP)+parseFloat(plumbing.pipeInstP));
    const fix=(parseFloat(plumbing.bathCount)||0)*parseFloat(plumbing.bathSetP)+(parseFloat(plumbing.kitchenCount)||0)*parseFloat(plumbing.kitchenSetP);
    return {total:pipe+fix+(parseFloat(plumbing.etcAmt)||0)};
  };
  const calcElectric = () => {
    const o=(parseFloat(electric.outlet)||0)*(parseFloat(electric.outletP)+parseFloat(electric.outletInstP));
    const sw=(parseFloat(electric.switch_)||0)*(parseFloat(electric.switchP)+parseFloat(electric.switchInstP));
    const l=(parseFloat(electric.lighting)||0)*(parseFloat(electric.lightingP)+parseFloat(electric.lightingInstP));
    const p=(parseFloat(electric.panel)||0)*parseFloat(electric.panelP);
    return {total:o+sw+l+p+(parseFloat(electric.etcAmt)||0)};
  };
  const calcPlaster   = () => ({total:(parseFloat(plaster.area)||0)*(parseFloat(plaster.matP)+parseFloat(plaster.instP))+(parseFloat(plaster.etcAmt)||0)});
  const calcCarpentry = () => {
    if(carpentry.mode==="direct") return {total:parseFloat(carpentry.directAmt)||0};
    const cc=(parseFloat(carpentry.ceilingArea)||0)*parseFloat(carpentry.ceilingP);
    const wc=(parseFloat(carpentry.wallArea)||0)*parseFloat(carpentry.wallP);
    const pc=(parseFloat(carpentry.partitionArea)||0)*parseFloat(carpentry.partitionP);
    const mc=(parseFloat(carpentry.moldingLen)||0)*(parseFloat(carpentry.moldingP)+parseFloat(carpentry.moldingInstP));
    const bc=(parseFloat(carpentry.baseLen)||0)*(parseFloat(carpentry.baseP)+parseFloat(carpentry.baseInstP));
    return {total:cc+wc+pc+mc+bc+(parseFloat(carpentry.etcAmt)||0)};
  };
  const calcTileRow = (row) => {
    if(row.mode==="direct") return {direct:true,total:parseFloat(row.directAmt)||0};
    const mat=TILE_MATS.find(m=>m.id===row.matId); if(!mat) return null;
    const area=parseFloat(row.area)||0, matP=parseFloat(row.customMatP)||mat.matP, instP=parseFloat(row.customInstP)||mat.instP;
    const qty=Math.ceil(area*mat.perSqm*(1+mat.loss)), matPerSqm=matP*mat.perSqm*(1+mat.loss);
    return {mat,area,qty,matP,instP,matCost:qty*matP,instCost:area*instP,matPerSqm,total:qty*matP+area*instP};
  };
  const calcSanitaryRow = (row) => {
    const item=SANITARY_ITEMS.find(i=>i.id===row.itemId); if(!item) return null;
    const matP=parseFloat(row.customMatP)||item.defP, instP=parseFloat(row.customInstP)||item.instP, qty=parseFloat(row.qty)||0;
    return {item,qty,matP,instP,matCost:qty*matP,instCost:qty*instP,total:qty*(matP+instP)};
  };
  const calcFloorRow = (row) => {
    if(row.mode==="direct") return {direct:true,total:parseFloat(row.directAmt)||0};
    const mat=FLOOR_MATS.find(m=>m.id===row.matId); if(!mat) return null;
    const area=parseFloat(row.area)||0, matP=parseFloat(row.customMatP)||mat.matP, instP=parseFloat(row.customInstP)||mat.instP;
    const qty=Math.ceil(area*mat.perSqm*(1+mat.loss)), matPerSqm=matP*mat.perSqm*(1+mat.loss);
    return {mat,area,qty,matP,instP,matCost:qty*matP,instCost:area*instP,matPerSqm,total:qty*matP+area*instP};
  };
  const calcPaint = () => {
    const wa=parseFloat(paint.wallArea)||0, ca=parseFloat(paint.ceilingArea)||0;
    const wc=wa*(parseFloat(paint.puttyP)+parseFloat(paint.paintMatP)*parseFloat(paint.wallCoat)+parseFloat(paint.paintInstP));
    const cc=ca*(parseFloat(paint.ceilMatP)*parseFloat(paint.ceilingCoat)+parseFloat(paint.ceilInstP));
    return {total:wc+cc+(parseFloat(paint.etcAmt)||0)};
  };
  const calcFilmRow = (row) => {
    if(row.mode==="direct") return {direct:true,total:parseFloat(row.directAmt)||0};
    const area=parseFloat(row.area)||0;
    return {area,total:area*((parseFloat(row.matP)||0)+(parseFloat(row.instP)||0))};
  };
  const calcWallpaper = () => {
    if(wallpaper.mode==="direct") return {direct:true,total:parseFloat(wallpaper.directAmt)||0};
    const wallType=WALLPAPER_TYPES.find(t=>t.id===wallpaper.wallTypeId)||WALLPAPER_TYPES[1];
    const ceilType=WALLPAPER_TYPES.find(t=>t.id===wallpaper.ceilTypeId)||WALLPAPER_TYPES[0];
    const wa=parseFloat(wallpaper.wallArea)||0, ca=parseFloat(wallpaper.ceilingArea)||0;
    const wr=Math.ceil(wa/wallType.sqmPerRoll), cr=Math.ceil(ca/ceilType.sqmPerRoll);
    const wmc=wr*wallType.defP, wic=wa*parseFloat(wallpaper.wallInstP);
    const cmc=cr*ceilType.defP, cic=ca*parseFloat(wallpaper.ceilInstP);
    return {wr,cr,wallType,ceilType,wmc,wic,cmc,cic,total:wmc+wic+cmc+cic+(parseFloat(wallpaper.etcAmt)||0)};
  };
  const calcFurnitureRow = (row) => {
    const item=FURNITURE_ITEMS.find(i=>i.id===row.itemId); if(!item) return null;
    const p=parseFloat(row.customP)||item.defP, q=parseFloat(row.qty)||0;
    return {item,unitP:p,qty:q,total:p*q};
  };

  const costTotals = {
    protection: directSections.protection?(parseFloat(directAmts.protection)||0):protectRows.reduce((s,r)=>{const c=calcProtectRow(r);return s+(c?c.total:0);},0),
    demolition: directSections.demolition?(parseFloat(directAmts.demolition)||0):demoRows.reduce((s,r)=>{const c=calcDemoRow(r);return s+(c?c.total:0);},0),
    waste:      directSections.waste?(parseFloat(directAmts.waste)||0):wasteRows.reduce((s,r)=>{const c=calcWasteRow(r);return s+(c?c.total:0);},0),
    window:     directSections.window?(parseFloat(directAmts.window)||0):windowRows.reduce((s,r)=>s+calcWindowRow(r).total,0),
    plumbing:   directSections.plumbing?(parseFloat(directAmts.plumbing)||0):calcPlumbing().total,
    electric:   directSections.electric?(parseFloat(directAmts.electric)||0):calcElectric().total,
    plaster:    directSections.plaster?(parseFloat(directAmts.plaster)||0):calcPlaster().total,
    carpentry:  calcCarpentry().total,
    tile:       tileRows.reduce((s,r)=>{const c=calcTileRow(r);return s+(c?c.total:0);},0),
    sanitary:   directSections.sanitary?(parseFloat(directAmts.sanitary)||0):sanitaryRows.reduce((s,r)=>{const c=calcSanitaryRow(r);return s+(c?c.total:0);},0),
    floor:      floorRows.reduce((s,r)=>{const c=calcFloorRow(r);return s+(c?c.total:0);},0),
    paint:      directSections.paint?(parseFloat(directAmts.paint)||0):calcPaint().total,
    film:       filmRows.reduce((s,r)=>{const c=calcFilmRow(r);return s+(c?c.total:0);},0),
    wallpaper:  calcWallpaper().total,
    furniture:  directSections.furniture?(parseFloat(directAmts.furniture)||0):furnitureRows.reduce((s,r)=>{const c=calcFurnitureRow(r);return s+(c?c.total:0);},0),
    etc:        etcRows.reduce((s,r)=>s+(parseFloat(r.amt)||0),0),
  };
  const costTotal   = selectedTrades.reduce((s,id)=>s+(costTotals[id]||0),0);
  const marginAmt   = costTotal*marginRate;
  const supplyPrice = costTotal+marginAmt;
  const vatAmt      = supplyPrice*0.1;
  const finalPrice  = supplyPrice+vatAmt;

  const stepList  = ["info","trades","detail","summary"];
  const stepsDone = (s) => stepList.indexOf(step)>stepList.indexOf(s);
  const std       = AUTO_CALC[siteInfo.type]||AUTO_CALC["기타"];

  return (
    <div style={S.root}>
      {/* 헤더 */}
      <header style={S.header}>
        <div style={S.headerTop}>
          <div style={S.logo}>M</div>
          <div style={{flex:1}}>
            <div style={{fontWeight:700,fontSize:16,color:"#fff"}}>M Design Works</div>
            <div style={{fontSize:12,color:"#666"}}>인테리어 견적 산출 v7.2</div>
          </div>
          <div style={{display:"flex",gap:8,flexShrink:0}}>
            <button style={{background:"#1e1e1e",border:"1px solid #2a2a2a",borderRadius:8,padding:"8px 12px",color:"#aaa",fontWeight:600,fontSize:12,cursor:"pointer",display:"flex",alignItems:"center",gap:5}}
              onClick={()=>setShowSavedModal(true)}>
              📂 {savedList.length>0?<span style={{background:"#E8A020",color:"#111",borderRadius:10,padding:"0 6px",fontSize:11,fontWeight:700}}>{savedList.length}</span>:""}
              목록
            </button>
            <button style={{background:"#1a3a1a",border:"1px solid #2a5a2a",borderRadius:8,padding:"8px 12px",color:"#88cc88",fontWeight:600,fontSize:12,cursor:"pointer"}}
              onClick={()=>{if(!siteInfo.name){showToast("현장명을 먼저 입력하세요.");return;}handleSaveToBrowser();}}>
              💾 저장
            </button>
          </div>
        </div>
        <div style={S.stepBar}>
          {[["info","현장정보"],["trades","공종선택"],["detail","상세입력"],["summary","최종견적"]].map(([s,label],i)=>(
            <div key={s} style={S.stepItem}>
              <div style={{...S.stepDot,background:step===s?"#E8A020":stepsDone(s)?"#555":"#222",border:step===s?"2px solid #E8A020":"2px solid #333",color:step===s?"#111":"#fff"}}>
                {stepsDone(s)?"✓":i+1}
              </div>
              <div style={{fontSize:10,fontWeight:500,color:step===s?"#E8A020":"#555"}}>{label}</div>
            </div>
          ))}
        </div>
      </header>

      <main style={S.main}>

        {/* ─ STEP 1 ─ */}
        {step==="info" && (
          <React.Fragment>
          <div style={S.card}>
            <div style={{...S.cardTitle,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <span>📂 견적 불러오기</span>
              <button style={{...S.btnSecondary,padding:"7px 12px",fontSize:12}} onClick={()=>fileInputRef.current.click()}>📁 파일에서 불러오기</button>
              <input ref={fileInputRef} type="file" accept=".json,application/json" style={{display:"none"}} onChange={handleImportFile}/>
            </div>
            {savedList.length>0 ? (
              <div>
                {savedList.map(e=>(
                  <div key={e.id} style={{...S.rowBox,display:"flex",justifyContent:"space-between",alignItems:"center",gap:10}}>
                    <div>
                      <div style={{color:"#fff",fontWeight:600,fontSize:13}}>{e.name}{e.client?` · ${e.client}`:""}</div>
                      <div style={{color:"#666",fontSize:11,marginTop:3}}>{new Date(e.savedAt).toLocaleString("ko-KR")} · {fmt(e.total)}원</div>
                    </div>
                    <div style={{display:"flex",gap:6,flexShrink:0}}>
                      <button style={{...S.btnSecondary,padding:"7px 12px",fontSize:12}} onClick={()=>handleLoadSaved(e)}>불러오기</button>
                      {confirmDeleteId===e.id ? (
                        <button style={{background:"#3a1a1a",border:"1px solid #663",color:"#f88",fontSize:11,fontWeight:600,borderRadius:6,padding:"7px 10px",cursor:"pointer"}} onClick={()=>handleDeleteSaved(e.id)}>삭제확인</button>
                      ) : (
                        <button style={{background:"transparent",border:"none",color:"#664",fontSize:16,cursor:"pointer"}} onClick={()=>{setConfirmDeleteId(e.id);setTimeout(()=>setConfirmDeleteId(null),3000);}}>✕</button>
                      )}
                    </div>
                  </div>
                ))}
              </div>
            ) : (
              <div style={{color:"#555",fontSize:12}}>저장된 견적이 없습니다. 최종견적 단계에서 "브라우저에 저장"으로 저장할 수 있어요.</div>
            )}
          </div>
          <div style={S.card}>
            <div style={S.cardTitle}>현장 기본정보</div>
            <div style={S.grid2}>
              <Field label="현장명 *"><input style={S.input} placeholder="예) 대구 수성구 302호" value={siteInfo.name} onChange={e=>setSiteInfo({...siteInfo,name:e.target.value})}/></Field>
              <Field label="고객명"><input style={S.input} placeholder="예) 홍길동" value={siteInfo.client} onChange={e=>setSiteInfo({...siteInfo,client:e.target.value})}/></Field>
              <Field label="현장유형 *">
                <select style={S.input} value={siteInfo.type} onChange={e=>setSiteInfo({...siteInfo,type:e.target.value})}>
                  {SITE_TYPES.map(t=><option key={t}>{t}</option>)}
                </select>
              </Field>
              <Field label="총 면적 (m²) *"><input style={S.input} type="number" placeholder="예) 106" value={siteInfo.area} onChange={e=>setSiteInfo({...siteInfo,area:e.target.value})}/></Field>
              <Field label="작성일"><input style={S.input} type="date" value={siteInfo.date} onChange={e=>setSiteInfo({...siteInfo,date:e.target.value})}/></Field>
              <Field label="특이사항"><input style={S.input} placeholder="발코니 확장, 욕실 2개 등" value={siteInfo.memo} onChange={e=>setSiteInfo({...siteInfo,memo:e.target.value})}/></Field>
            </div>
            {siteInfo.area && (
              <div style={S.autoPreview}>
                <div style={{color:"#88cc88",fontWeight:600,fontSize:13,marginBottom:10}}>
                  📐 {siteInfo.type} 자동산출 예상값 ({siteInfo.area}m² · 약 {Math.round(parseFloat(siteInfo.area)/3.305)}평)
                </div>
                <div style={S.autoGrid}>
                  {[
                    ["마루/장판", r1(parseFloat(siteInfo.area)*std.floorWood)+"m²"],
                    ["타일 바닥", r1(parseFloat(siteInfo.area)*std.floorTile)+"m²"],
                    ["타일 벽",   r1(parseFloat(siteInfo.area)*std.tileWall)+"m²"],
                    ["도배 벽",   r1(parseFloat(siteInfo.area)*std.wallpaper)+"m²"],
                    ["도장 벽",   r1(parseFloat(siteInfo.area)*std.paintWall)+"m²"],
                    ["목공 천장", r1(parseFloat(siteInfo.area)*std.ceilingCarp)+"m²"],
                    ["창호",      r0(parseFloat(siteInfo.area)/3.305/std.windowPer)+"개"],
                    ["콘센트",    r0(parseFloat(siteInfo.area)/3.305*std.outletPer)+"개"],
                    ["조명",      r0(parseFloat(siteInfo.area)/3.305*std.lightingPer)+"개"],
                    ["폐기물",    r1(parseFloat(siteInfo.area)*std.wastePer)+"톤"],
                  ].map(([l,v])=><AutoItem key={l} label={l} val={v}/>)}
                </div>
                <div style={{fontSize:11,color:"#666",marginTop:8}}>💡 {std.note}</div>
              </div>
            )}
            <BtnRow>
              <button style={{...S.btnPrimary,background:"#1a3a1a",color:"#88cc88",border:"1px solid #2a5a2a",flex:1}}
                onClick={()=>{if(!siteInfo.name||!siteInfo.area){alert("현장명·면적 필수");return;}applyAutoCalc();}}>
                ⚡ 자동계산 적용
              </button>
              <Btn onClick={()=>{if(!siteInfo.name){alert("현장명을 입력하세요");return;}setStep("trades");}}>수동 →</Btn>
            </BtnRow>
          </div>
          </React.Fragment>
        )}

        {/* ─ STEP 2 ─ */}
        {step==="trades" && (
          <div style={S.card}>
            <div style={S.cardTitle}>공종 선택</div>
            <div style={S.tradeGrid}>
              {TRADES.map((t,i)=>{
                const active=selectedTrades.includes(t.id);
                return (
                  <button key={t.id} style={{...S.tradeBtn,...(active?S.tradeBtnOn:{})}} onClick={()=>toggleTrade(t.id)}>
                    <span style={{fontSize:20}}>{t.icon}</span>
                    <span style={{color:active?"#E8A020":"#ccc",fontWeight:600,fontSize:12,marginTop:2}}>{t.label}</span>
                    <span style={{color:"#444",fontSize:10}}>{i+1}</span>
                    {active&&<span style={{position:"absolute",top:6,right:8,color:"#E8A020",fontSize:12}}>✓</span>}
                  </button>
                );
              })}
            </div>
            <BtnRow>
              <BtnSec onClick={()=>setStep("info")}>← 이전</BtnSec>
              <Btn onClick={()=>{if(!selectedTrades.length){alert("공종을 선택하세요");return;}setStep("detail");}}>다음 →</Btn>
            </BtnRow>
          </div>
        )}

        {/* ─ STEP 3 ─ */}
        {step==="detail" && (
          <div>
            {autoApplied && (
              <div style={S.banner}>
                ⚡ {siteInfo.type} 기준 자동적용 · 수치 확인 후 수정하세요
                <button style={S.bannerBtn} onClick={applyAutoCalc}>재적용</button>
              </div>
            )}

            {/* 보양 */}
            {selectedTrades.includes("protection") && (
              <Section title="🛡️ 보양">
                <ModeToggle mode={directSections.protection?"direct":"calc"} onChange={v=>setDS("protection",v==="direct")}/>
                {directSections.protection ? (
                  <div style={S.grid2}>
                    <Field label="보양 총금액 (원)"><Inp val={directAmts.protection} onChange={v=>setDA("protection",v)} ph="0"/></Field>
                    {parseFloat(directAmts.protection)>0&&<Field label="소계"><div style={S.calcVal}>{fmt(parseFloat(directAmts.protection))}원</div></Field>}
                  </div>
                ) : (<React.Fragment>
                {protectRows.map((row,i)=>{
                  const mat=PROTECT_MATS.find(m=>m.id===row.matId), c=calcProtectRow(row);
                  return (
                    <div key={row.id} style={S.rowBox}>
                      <RowHeader idx={i} onRemove={protectRows.length>1?()=>removeRow(setProtectRows,row.id):null}/>
                      <div style={S.grid3}>
                        <Field label="위치"><input style={S.input} value={row.location} onChange={e=>updateRow(setProtectRows,row.id,"location",e.target.value)} placeholder="엘리베이터/복도..."/></Field>
                        <Field label="보양재">
                          <select style={S.input} value={row.matId} onChange={e=>updateRow(setProtectRows,row.id,"matId",e.target.value)}>
                            {PROTECT_MATS.map(m=><option key={m.id} value={m.id}>{m.label}</option>)}
                          </select>
                        </Field>
                        <Field label="단위">
                          <select style={S.input} value={row.unit} onChange={e=>updateRow(setProtectRows,row.id,"unit",e.target.value)}>
                            {["m²","식","개"].map(u=><option key={u}>{u}</option>)}
                          </select>
                        </Field>
                        <Field label={"수량 ("+row.unit+")"}><Inp val={row.qty} onChange={v=>updateRow(setProtectRows,row.id,"qty",v)} ph="0"/></Field>
                        <Field label={"단가 (기본 "+fmt(mat?mat.defP:0)+"원)"}><Inp val={row.customP} onChange={v=>updateRow(setProtectRows,row.id,"customP",v)} ph={fmt(mat?mat.defP:0)}/></Field>
                        {c&&parseFloat(row.qty)>0&&<Field label="소계"><div style={S.calcVal}>{fmt(c.total)}원</div></Field>}
                      </div>
                    </div>
                  );
                })}
                <AddBtn onClick={()=>addRow(setProtectRows,{location:"",matId:"cardboard",qty:"",unit:"m²",customP:""})} c="+ 항목 추가"/>
                </React.Fragment>)}
                <Total label="보양 합계" val={costTotals.protection}/>
              </Section>
            )}

            {/* 철거 */}
            {selectedTrades.includes("demolition") && (
              <Section title="🔨 철거">
                <ModeToggle mode={directSections.demolition?"direct":"calc"} onChange={v=>setDS("demolition",v==="direct")}/>
                {directSections.demolition ? (
                  <div style={S.grid2}>
                    <Field label="철거 총금액 (원)"><Inp val={directAmts.demolition} onChange={v=>setDA("demolition",v)} ph="0"/></Field>
                    {parseFloat(directAmts.demolition)>0&&<Field label="소계"><div style={S.calcVal}>{fmt(parseFloat(directAmts.demolition))}원</div></Field>}
                  </div>
                ) : (<React.Fragment>
                {demoRows.map((row,i)=>{
                  const c=calcDemoRow(row), item=DEMO_ITEMS.find(it=>it.id===row.itemId);
                  return (
                    <div key={row.id} style={S.rowBox}>
                      <RowHeader idx={i} onRemove={demoRows.length>1?()=>removeRow(setDemoRows,row.id):null}/>
                      <div style={S.grid3}>
                        <Field label="철거 항목">
                          <select style={S.input} value={row.itemId} onChange={e=>updateRow(setDemoRows,row.id,"itemId",e.target.value)}>
                            {DEMO_ITEMS.map(it=><option key={it.id} value={it.id}>{it.label} ({it.unit})</option>)}
                          </select>
                        </Field>
                        <Field label={"수량 ("+(item?item.unit:"")+")"}><Inp val={row.qty} onChange={v=>updateRow(setDemoRows,row.id,"qty",v)} ph="0"/></Field>
                        <Field label={"단가 (기본 "+fmt(item?item.defP:0)+"원)"}><Inp val={row.customP} onChange={v=>updateRow(setDemoRows,row.id,"customP",v)} ph={fmt(item?item.defP:0)}/></Field>
                        {c&&c.qty>0&&<Field label="소계"><div style={S.calcVal}>{fmt(c.total)}원</div></Field>}
                      </div>
                    </div>
                  );
                })}
                <AddBtn onClick={()=>addRow(setDemoRows,{itemId:"wall",qty:"",customP:""})} c="+ 항목 추가"/>
                </React.Fragment>)}
                <Total label="철거 합계" val={costTotals.demolition}/>
              </Section>
            )}

            {/* 폐기물 */}
            {selectedTrades.includes("waste") && (
              <Section title="🚛 폐기물 처리">
                <ModeToggle mode={directSections.waste?"direct":"calc"} onChange={v=>setDS("waste",v==="direct")}/>
                {directSections.waste ? (
                  <div style={S.grid2}>
                    <Field label="폐기물 총금액 (원)"><Inp val={directAmts.waste} onChange={v=>setDA("waste",v)} ph="0"/></Field>
                    {parseFloat(directAmts.waste)>0&&<Field label="소계"><div style={S.calcVal}>{fmt(parseFloat(directAmts.waste))}원</div></Field>}
                  </div>
                ) : (<React.Fragment>
                {wasteRows.map((row,i)=>{
                  const c=calcWasteRow(row), item=WASTE_ITEMS.find(it=>it.id===row.itemId);
                  return (
                    <div key={row.id} style={S.rowBox}>
                      <RowHeader idx={i} onRemove={wasteRows.length>1?()=>removeRow(setWasteRows,row.id):null}/>
                      <div style={S.grid3}>
                        <Field label="처리 항목">
                          <select style={S.input} value={row.itemId} onChange={e=>updateRow(setWasteRows,row.id,"itemId",e.target.value)}>
                            {WASTE_ITEMS.map(it=><option key={it.id} value={it.id}>{it.label} ({it.unit})</option>)}
                          </select>
                        </Field>
                        <Field label={"수량 ("+(item?item.unit:"")+")"}><Inp val={row.qty} onChange={v=>updateRow(setWasteRows,row.id,"qty",v)} ph="0"/></Field>
                        <Field label={"단가 (기본 "+fmt(item?item.defP:0)+"원)"}><Inp val={row.customP} onChange={v=>updateRow(setWasteRows,row.id,"customP",v)} ph={fmt(item?item.defP:0)}/></Field>
                        {c&&c.qty>0&&<Field label="소계"><div style={S.calcVal}>{fmt(c.total)}원</div></Field>}
                      </div>
                    </div>
                  );
                })}
                <AddBtn onClick={()=>addRow(setWasteRows,{itemId:"truck1",qty:"",customP:""})} c="+ 항목 추가"/>
                </React.Fragment>)}
                <Total label="폐기물 합계" val={costTotals.waste}/>
              </Section>
            )}

            {/* 창호 */}
            {selectedTrades.includes("window") && (
              <Section title="🪟 창호·샷시">
                <ModeToggle mode={directSections.window?"direct":"calc"} onChange={v=>setDS("window",v==="direct")}/>
                {directSections.window ? (
                  <div style={S.grid2}>
                    <Field label="창호 총금액 (원)"><Inp val={directAmts.window} onChange={v=>setDA("window",v)} ph="0"/></Field>
                    {parseFloat(directAmts.window)>0&&<Field label="소계"><div style={S.calcVal}>{fmt(parseFloat(directAmts.window))}원</div></Field>}
                  </div>
                ) : (<React.Fragment>
                {windowRows.map((row,i)=>{
                  const c=calcWindowRow(row), wt=WINDOW_TYPES.find(t=>t.id===row.typeId);
                  return (
                    <div key={row.id} style={S.rowBox}>
                      <RowHeader idx={i} onRemove={windowRows.length>1?()=>removeRow(setWindowRows,row.id):null}/>
                      <div style={S.grid3}>
                        <Field label="위치/명칭"><input style={S.input} value={row.label} onChange={e=>updateRow(setWindowRows,row.id,"label",e.target.value)} placeholder="거실 창"/></Field>
                        <Field label="종류">
                          <select style={S.input} value={row.typeId} onChange={e=>updateRow(setWindowRows,row.id,"typeId",e.target.value)}>
                            {WINDOW_TYPES.map(t=><option key={t.id} value={t.id}>{t.label}</option>)}
                          </select>
                        </Field>
                        <Field label="수량 (개)"><Inp val={row.qty} onChange={v=>updateRow(setWindowRows,row.id,"qty",v)} ph="0"/></Field>
                        <Field label={"단가 (기본 "+fmt(wt?wt.defP:0)+"원)"}><Inp val={row.customP} onChange={v=>updateRow(setWindowRows,row.id,"customP",v)} ph={fmt(wt?wt.defP:0)}/></Field>
                        {c.qty>0&&<Field label="소계"><div style={S.calcVal}>{fmt(c.total)}원</div></Field>}
                      </div>
                    </div>
                  );
                })}
                <AddBtn onClick={()=>addRow(setWindowRows,{typeId:"pvc_double",label:"",qty:"",customP:""})} c="+ 창호 추가"/>
                </React.Fragment>)}
                <Total label="창호 합계" val={costTotals.window}/>
              </Section>
            )}

            {/* 설비 */}
            {selectedTrades.includes("plumbing") && (
              <Section title="🔧 설비·배관">
                <ModeToggle mode={directSections.plumbing?"direct":"calc"} onChange={v=>setDS("plumbing",v==="direct")}/>
                {directSections.plumbing ? (
                  <div style={S.grid2}>
                    <Field label="설비 총금액 (원)"><Inp val={directAmts.plumbing} onChange={v=>setDA("plumbing",v)} ph="0"/></Field>
                    {parseFloat(directAmts.plumbing)>0&&<Field label="소계"><div style={S.calcVal}>{fmt(parseFloat(directAmts.plumbing))}원</div></Field>}
                  </div>
                ) : (<React.Fragment>
                <SubTitle c="배관 길이"/>
                <div style={S.grid3}>
                  <Field label="급수 배관 (m)"><Inp val={plumbing.hotLen}     onChange={v=>setPlumbing({...plumbing,hotLen:v})}     ph="0"/></Field>
                  <Field label="냉수 배관 (m)"><Inp val={plumbing.coldLen}    onChange={v=>setPlumbing({...plumbing,coldLen:v})}    ph="0"/></Field>
                  <Field label="배수 배관 (m)"><Inp val={plumbing.drainLen}   onChange={v=>setPlumbing({...plumbing,drainLen:v})}   ph="0"/></Field>
                  <Field label="재료비 (/m)">  <Inp val={plumbing.pipeMatP}  onChange={v=>setPlumbing({...plumbing,pipeMatP:v})}/></Field>
                  <Field label="시공비 (/m)">  <Inp val={plumbing.pipeInstP} onChange={v=>setPlumbing({...plumbing,pipeInstP:v})}/></Field>
                </div>
                <SubTitle c="욕실·주방 세팅비"/>
                <div style={S.grid3}>
                  <Field label="욕실 수 (개)">      <Inp val={plumbing.bathCount}    onChange={v=>setPlumbing({...plumbing,bathCount:v})}    ph="0"/></Field>
                  <Field label="욕실 세팅비 (/개)"> <Inp val={plumbing.bathSetP}    onChange={v=>setPlumbing({...plumbing,bathSetP:v})}/></Field>
                  <Field label="주방 수 (개)">      <Inp val={plumbing.kitchenCount} onChange={v=>setPlumbing({...plumbing,kitchenCount:v})} ph="0"/></Field>
                  <Field label="주방 세팅비 (/개)"> <Inp val={plumbing.kitchenSetP} onChange={v=>setPlumbing({...plumbing,kitchenSetP:v})}/></Field>
                  <Field label="기타 금액">          <Inp val={plumbing.etcAmt}      onChange={v=>setPlumbing({...plumbing,etcAmt:v})}      ph="0"/></Field>
                </div>
                </React.Fragment>)}
                <Total label="설비 합계" val={costTotals.plumbing}/>
              </Section>
            )}

            {/* 전기 */}
            {selectedTrades.includes("electric") && (
              <Section title="⚡ 전기">
                <ModeToggle mode={directSections.electric?"direct":"calc"} onChange={v=>setDS("electric",v==="direct")}/>
                {directSections.electric ? (
                  <div style={S.grid2}>
                    <Field label="전기 총금액 (원)"><Inp val={directAmts.electric} onChange={v=>setDA("electric",v)} ph="0"/></Field>
                    {parseFloat(directAmts.electric)>0&&<Field label="소계"><div style={S.calcVal}>{fmt(parseFloat(directAmts.electric))}원</div></Field>}
                  </div>
                ) : (<div style={S.grid3}>

                          </select>
                        </Field>
                        <Field label="벽 면적 (m²)"><Inp val={wallpaper.wallArea}  onChange={v=>setWallpaper({...wallpaper,wallArea:v})}  ph="0"/></Field>
                        <Field label="시공비 (/m²)"> <Inp val={wallpaper.wallInstP} onChange={v=>setWallpaper({...wallpaper,wallInstP:v})}/></Field>
                      </div>
                      <SubTitle c="천장지"/>
                      <div style={S.grid3}>
                        <Field label="천장지 종류">
                          <select style={S.input} value={wallpaper.ceilTypeId} onChange={e=>setWallpaper({...wallpaper,ceilTypeId:e.target.value})}>
                            {WALLPAPER_TYPES.map(t=><option key={t.id} value={t.id}>{t.label} ({t.sqmPerRoll}m²/롤)</option>)}
                          </select>
                        </Field>
                        <Field label="천장 면적 (m²)"><Inp val={wallpaper.ceilingArea} onChange={v=>setWallpaper({...wallpaper,ceilingArea:v})} ph="0"/></Field>
                        <Field label="시공비 (/m²)">   <Inp val={wallpaper.ceilInstP}  onChange={v=>setWallpaper({...wallpaper,ceilInstP:v})}/></Field>
                        <Field label="기타 금액">        <Inp val={wallpaper.etcAmt}     onChange={v=>setWallpaper({...wallpaper,etcAmt:v})}     ph="0"/></Field>
                      </div>
                      {(!c.direct)&&(parseFloat(wallpaper.wallArea)||parseFloat(wallpaper.ceilingArea))>0&&(
                        <div style={S.calcBox}>
                          <CRow label={"벽지 소요량 ("+c.wallType.sqmPerRoll+"m²/롤)"} val={c.wr+"롤 × "+fmt(c.wallType.defP)+"원 = "+fmt(c.wmc)+"원"}/>
                          <CRow label={"천장지 소요량 ("+c.ceilType.sqmPerRoll+"m²/롤)"} val={c.cr+"롤 × "+fmt(c.ceilType.defP)+"원 = "+fmt(c.cmc)+"원"}/>
                          <CRow label="벽 시공비" val={fmt(c.wic)+"원"}/>
                          <CRow label="천장 시공비" val={fmt(c.cic)+"원"}/>
                        </div>
                      )}
                    </React.Fragment>
                  );
                })()}
                <Total label="도배 합계" val={costTotals.wallpaper}/>
              </Section>
            )}

            {/* 가구 */}
            {selectedTrades.includes("furniture") && (
              <Section title="🛋️ 가구·붙박이">
                <ModeToggle mode={directSections.furniture?"direct":"calc"} onChange={v=>setDS("furniture",v==="direct")}/>
                {directSections.furniture ? (
                  <div style={S.grid2}>
                    <Field label="가구 총금액 (원)"><Inp val={directAmts.furniture} onChange={v=>setDA("furniture",v)} ph="0"/></Field>
                    {parseFloat(directAmts.furniture)>0&&<Field label="소계"><div style={S.calcVal}>{fmt(parseFloat(directAmts.furniture))}원</div></Field>}
                  </div>
                ) : (<React.Fragment>
                {furnitureRows.map((row,i)=>{
                  const c=calcFurnitureRow(row), item=FURNITURE_ITEMS.find(it=>it.id===row.itemId);
                  return (
                    <div key={row.id} style={S.rowBox}>
                      <RowHeader idx={i} onRemove={furnitureRows.length>1?()=>removeRow(setFurnitureRows,row.id):null}/>
                      <div style={S.grid3}>
                        <Field label="품목">
                          <select style={S.input} value={row.itemId} onChange={e=>updateRow(setFurnitureRows,row.id,"itemId",e.target.value)}>
                            {FURNITURE_ITEMS.map(it=><option key={it.id} value={it.id}>{it.label} ({it.unit})</option>)}
                          </select>
                        </Field>
                        <Field label="수량"><Inp val={row.qty} onChange={v=>updateRow(setFurnitureRows,row.id,"qty",v)}/></Field>
                        <Field label={"단가 (기본 "+fmt(item?item.defP:0)+"원)"}><Inp val={row.customP} onChange={v=>updateRow(setFurnitureRows,row.id,"customP",v)} ph={fmt(item?item.defP:0)}/></Field>
                        {c&&<Field label="소계"><div style={S.calcVal}>{fmt(c.total)}원</div></Field>}
                      </div>
                    </div>
                  );
                })}
                <AddBtn onClick={()=>addRow(setFurnitureRows,{itemId:"wardrobe",qty:"1",customP:""})} c="+ 품목 추가"/>
                </React.Fragment>)}
                <Total label="가구 합계" val={costTotals.furniture}/>
              </Section>
            )}

            {/* 기타공사 */}
            {selectedTrades.includes("etc") && (
              <Section title="📦 기타공사">
                <div style={{fontSize:11,color:"#666",marginBottom:10}}>빔프로젝터 설치, 특수조명, 간판 등 위 공종에 해당 없는 항목</div>
                {etcRows.map((row,i)=>(
                  <div key={row.id} style={S.rowBox}>
                    <RowHeader idx={i} onRemove={etcRows.length>1?()=>removeRow(setEtcRows,row.id):null}/>
                    <div style={S.grid2}>
                      <Field label="항목명"><input style={S.input} value={row.memo} onChange={e=>updateRow(setEtcRows,row.id,"memo",e.target.value)} placeholder="예) 빔프로젝터 설치, 청소비..."/></Field>
                      <Field label="금액 (원)"><Inp val={row.amt} onChange={v=>updateRow(setEtcRows,row.id,"amt",v)} ph="0"/></Field>
                    </div>
                  </div>
                ))}
                <AddBtn onClick={()=>addRow(setEtcRows,{memo:"",amt:""})} c="+ 항목 추가"/>
                <Total label="기타공사 합계" val={costTotals.etc}/>
              </Section>
            )}

            <BtnRow>
              <BtnSec onClick={()=>setStep(autoApplied?"info":"trades")}>← 이전</BtnSec>
              <Btn onClick={()=>setStep("summary")}>다음 → 최종견적</Btn>
            </BtnRow>
          </div>
        )}

        {/* ─ STEP 4 ─ */}
        {step==="summary" && (
          <div>
            <div style={S.card}>
              <div style={S.cardTitle}>📋 현장 정보</div>
              <div style={S.infoBox}>
                {[
                  ["현장명", siteInfo.name],
                  ["유형",   siteInfo.type],
                  ["면적",   siteInfo.area+"m² (약 "+Math.round(parseFloat(siteInfo.area||0)/3.305)+"평)"],
                  ["고객명", siteInfo.client||"-"],
                  ["작성일", siteInfo.date],
                  siteInfo.memo?["특이사항",siteInfo.memo]:null,
                ].filter(Boolean).map(([k,v])=>(
                  <div key={k} style={S.infoRow}><span style={{color:"#666"}}>{k}</span><span style={{color:"#ddd"}}>{v}</span></div>
                ))}
              </div>
            </div>

            <div style={S.card}>
              <div style={S.cardTitle}>💰 마진 설정</div>
              <div style={{display:"flex",gap:8,marginBottom:14,flexWrap:"wrap"}}>
                {MARGIN_PRESETS.map(p=>(
                  <button key={p.rate} style={{padding:"8px 14px",borderRadius:8,fontSize:12,fontWeight:600,cursor:"pointer",
                    background:marginRate===p.rate?"#E8A020":"#1e1e1e",
                    color:marginRate===p.rate?"#111":"#888",
                    border:marginRate===p.rate?"none":"1px solid #2a2a2a"}}
                    onClick={()=>setMarginRate(p.rate)}>
                    {p.label} ({(p.rate*100).toFixed(0)}%)
                  </button>
                ))}
              </div>
              <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:8}}>
                <input type="range" min="0" max="50" value={Math.round(marginRate*100)}
                  onChange={e=>setMarginRate(parseFloat(e.target.value)/100)}
                  style={{flex:1,accentColor:"#E8A020"}}/>
                <div style={{color:"#E8A020",fontWeight:700,fontSize:18,minWidth:52}}>{(marginRate*100).toFixed(0)}%</div>
              </div>
              <div style={{fontSize:11,color:"#555"}}>슬라이더로 직접 조정 가능</div>
            </div>

            <div style={S.card}>
              <div style={S.cardTitle}>📊 공종별 원가</div>
              <table style={S.table}>
                <thead><tr>{["공종","원가"].map(h=><th key={h} style={S.th}>{h}</th>)}</tr></thead>
                <tbody>
                  {TRADES.filter(t=>selectedTrades.includes(t.id)).map(t=>(
                    <tr key={t.id} style={{borderBottom:"1px solid #1e1e1e"}}>
                      <td style={S.td}>{t.icon} {t.label}</td>
                      <td style={{...S.tdR,color:costTotals[t.id]>0?"#ccc":"#444"}}>{fmt(costTotals[t.id])}원</td>
                    </tr>
                  ))}
                </tbody>
              </table>
              <div style={S.totalSection}>
                <div style={S.totalRow}><span>원가 합계</span><span>{fmt(costTotal)}원</span></div>
                <div style={{...S.totalRow,color:"#88aa88"}}><span>마진 ({(marginRate*100).toFixed(0)}%)</span><span>+ {fmt(marginAmt)}원</span></div>
                <div style={{...S.totalRow,color:"#fff",borderTop:"1px solid #333",paddingTop:10,marginTop:4}}><span>공급가액</span><span>{fmt(supplyPrice)}원</span></div>
                <div style={S.totalRow}><span>부가세 (10%)</span><span>{fmt(vatAmt)}원</span></div>
                <div style={{...S.totalRow,color:"#fff",fontWeight:700,fontSize:18,borderTop:"1px solid #444",paddingTop:12,marginTop:4,borderBottom:"none"}}>
                  <span>최종 견적가 (VAT포함)</span>
                  <span style={{color:"#E8A020"}}>{fmt(finalPrice)}원</span>
                </div>
              </div>
              {parseFloat(siteInfo.area)>0 && (
                <div style={S.perSqmBox}>
                  {[
                    ["원가", fmt(costTotal/parseFloat(siteInfo.area)), "원/m²", false],
                    ["견적가", fmt(supplyPrice/parseFloat(siteInfo.area)), "원/m²", true],
                    ["견적가", fmt(supplyPrice/(parseFloat(siteInfo.area)/3.305)), "원/평", true],
                  ].map(([lbl,val,unit,hl],idx)=>(
                    <React.Fragment key={idx}>
                      {idx>0&&<div style={{width:1,background:"#2a2a2a"}}/>}
                      <div style={S.perSqmItem}>
                        <div style={{color:"#888",fontSize:10,marginBottom:2}}>{lbl}</div>
                        <div style={{color:hl?"#E8A020":"#ccc",fontWeight:700,fontSize:16}}>{val}</div>
                        <div style={{color:"#555",fontSize:11,marginTop:4}}>{unit}</div>
                      </div>
                    </React.Fragment>
                  ))}
                </div>
              )}
            </div>

            <BtnRow>
              <BtnSec onClick={()=>setStep("info")}>🏠 홈으로</BtnSec>
              <BtnSec onClick={()=>setStep("detail")}>← 수정</BtnSec>
              <button style={{...S.btnPrimary,background:"#1e1e1e",color:"#aaa",border:"1px solid #333"}} onClick={handleExportFile}>⬇ 파일로 저장</button>
              <button style={{...S.btnPrimary,background:"#1a3a1a",color:"#88cc88",border:"1px solid #2a5a2a"}} onClick={handleSaveToBrowser}>💾 브라우저에 저장</button>
              <button style={{...S.btnPrimary,background:"#1e1e1e",color:"#aaa",border:"1px solid #333"}} onClick={()=>window.print()}>🖨 인쇄</button>
            </BtnRow>
          </div>
        )}
      </main>
      <footer style={{textAlign:"center",color:"#333",fontSize:12,padding:"20px 0 40px"}}>
        M Design Works · 견적 산출 v7.3 · 16개 공종 · 면적계산 + 직접입력 · 저장/불러오기 · ☁️ 클라우드 동기화
      </footer>
      {/* ─ 견적 목록 모달 ─ */}
      {showSavedModal && (
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.85)",zIndex:1000,overflowY:"auto",WebkitOverflowScrolling:"touch"}}>
          <div style={{maxWidth:640,margin:"0 auto",padding:"20px 16px 60px"}}>
            <div style={{background:"#161616",border:"1px solid #222",borderRadius:12,padding:"20px 18px"}}>
              {/* 모달 헤더 */}
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
                <div style={{fontWeight:700,fontSize:16,color:"#fff"}}>📂 저장된 견적</div>
                <div style={{display:"flex",gap:8,alignItems:"center"}}>
                  <button style={{background:pin?"#1a2a3a":"#1e1e1e",border:pin?"1px solid #2a4a6a":"1px solid #2a2a2a",borderRadius:8,padding:"7px 12px",color:pin?"#6ab":"#aaa",fontSize:12,fontWeight:600,cursor:"pointer"}}
                    onClick={()=>{setPinInput(pin);setShowPinModal(true);}}>
                    {pin ? "☁️ 연결됨" : "☁️ 클라우드"}
                  </button>
                  <button style={{background:"#1e1e1e",border:"1px solid #2a2a2a",borderRadius:8,padding:"7px 12px",color:"#aaa",fontSize:12,fontWeight:600,cursor:"pointer"}}
                    onClick={()=>fileInputRef.current.click()}>
                    📁 파일에서 불러오기
                  </button>
                  <button style={{background:"transparent",border:"none",color:"#666",fontSize:22,cursor:"pointer",lineHeight:1,padding:"0 4px"}}
                    onClick={()=>setShowSavedModal(false)}>✕</button>
                </div>
              </div>

              {/* 목록 */}
              {savedList.length>0 ? (
                <div>
                  {savedList.map(e=>(
                    <div key={e.id} style={{background:"#0f0f0f",border:"1px solid #222",borderRadius:10,padding:14,marginBottom:10,display:"flex",justifyContent:"space-between",alignItems:"center",gap:10}}>
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{color:"#fff",fontWeight:600,fontSize:14,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{e.name}{e.client?` · ${e.client}`:""}</div>
                        <div style={{color:"#555",fontSize:11,marginTop:4}}>{new Date(e.savedAt).toLocaleString("ko-KR")} · <span style={{color:"#E8A020"}}>{fmt(e.total)}원</span></div>
                      </div>
                      <div style={{display:"flex",gap:6,flexShrink:0}}>
                        <button style={{background:"#E8A020",color:"#111",border:"none",borderRadius:7,padding:"8px 14px",fontWeight:700,fontSize:12,cursor:"pointer"}}
                          onClick={()=>{handleLoadSaved(e);setShowSavedModal(false);}}>
                          불러오기
                        </button>
                        {confirmDeleteId===e.id ? (
                          <button style={{background:"#3a1a1a",border:"1px solid #663",color:"#f88",fontSize:11,fontWeight:600,borderRadius:7,padding:"8px 10px",cursor:"pointer"}}
                            onClick={()=>handleDeleteSaved(e.id)}>
                            삭제확인
                          </button>
                        ) : (
                          <button style={{background:"transparent",border:"1px solid #2a2a2a",borderRadius:7,color:"#555",fontSize:14,cursor:"pointer",padding:"8px 10px"}}
                            onClick={()=>{setConfirmDeleteId(e.id);setTimeout(()=>setConfirmDeleteId(null),3000);}}>
                            ✕
                          </button>
                        )}
                      </div>
                    </div>
                  ))}
                </div>
              ) : (
                <div style={{color:"#555",fontSize:13,padding:"30px 0",textAlign:"center"}}>
                  저장된 견적이 없습니다.<br/>
                  <span style={{fontSize:12,color:"#444"}}>헤더의 💾 저장 버튼으로 언제든 저장할 수 있어요.</span>
                </div>
              )}

              {/* 클라우드 견적 목록 */}
              {cloudList.length>0 && (
                <div style={{marginTop:20,borderTop:"1px solid #1a2a3a",paddingTop:16}}>
                  <div style={{color:"#6ab",fontWeight:700,fontSize:13,marginBottom:10}}>☁️ 클라우드 견적 ({cloudList.length}개)</div>
                  {cloudList.map(e=>(
                    <div key={e.cloudId} style={{background:"#0a0f14",border:"1px solid #1a2a3a",borderRadius:10,padding:14,marginBottom:10,display:"flex",justifyContent:"space-between",alignItems:"center",gap:10}}>
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{color:"#cce",fontWeight:600,fontSize:14,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{e.name}{e.client?` · ${e.client}`:""}</div>
                        <div style={{color:"#445",fontSize:11,marginTop:4}}>{new Date(e.savedAt).toLocaleString("ko-KR")} · <span style={{color:"#E8A020"}}>{fmt(e.total)}원</span></div>
                      </div>
                      <div style={{display:"flex",gap:6,flexShrink:0}}>
                        <button style={{background:"#E8A020",color:"#111",border:"none",borderRadius:7,padding:"8px 14px",fontWeight:700,fontSize:12,cursor:"pointer"}}
                          onClick={()=>{handleLoadSaved({data:e.data});setShowSavedModal(false);}}>
                          불러오기
                        </button>
                        <button style={{background:"transparent",border:"1px solid #2a2a2a",borderRadius:7,color:"#555",fontSize:14,cursor:"pointer",padding:"8px 10px"}}
                          onClick={()=>handleDeleteCloud(e.cloudId)}>
                          ✕
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              )}
              {pin && cloudList.length===0 && (
                <div style={{marginTop:16,textAlign:"center"}}>
                  <button style={{background:"#0a1a2a",border:"1px solid #1a3a5a",borderRadius:8,color:"#6ab",padding:"10px 20px",fontSize:12,cursor:"pointer",fontWeight:600}}
                    onClick={()=>handleLoadFromCloud(pin)}>
                    {cloudLoading ? "로딩중..." : "☁️ 클라우드에서 새로고침"}
                  </button>
                </div>
              )}
            </div>
          </div>
        </div>
      )}

      {/* ─ PIN 모달 ─ */}
      {showPinModal && (
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.9)",zIndex:1100,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
          <div style={{background:"#161616",border:"1px solid #2a2a2a",borderRadius:14,padding:"24px 20px",width:"100%",maxWidth:360}}>
            <div style={{fontWeight:700,fontSize:16,color:"#fff",marginBottom:8}}>☁️ 클라우드 동기화 PIN</div>
            <div style={{color:"#888",fontSize:12,marginBottom:16,lineHeight:1.6}}>
              PIN 번호로 기기 간 견적을 공유합니다.<br/>
              <span style={{color:"#E8A020"}}>숫자 4~8자리를 입력하세요.</span>
            </div>
            <input
              type="number"
              value={pinInput}
              onChange={e=>setPinInput(e.target.value.slice(0,8))}
              placeholder="PIN 번호 입력"
              style={{width:"100%",background:"#0f0f0f",border:"1px solid #333",borderRadius:8,padding:"12px 14px",color:"#fff",fontSize:18,letterSpacing:4,textAlign:"center",marginBottom:12,outline:"none"}}
            />
            {pin && <div style={{color:"#555",fontSize:11,textAlign:"center",marginBottom:12}}>현재 PIN: {"*".repeat(pin.length-2)+pin.slice(-2)}</div>}
            <div style={{display:"flex",gap:8}}>
              <button style={{flex:1,background:"#E8A020",color:"#111",border:"none",borderRadius:8,padding:"12px",fontWeight:700,fontSize:14,cursor:"pointer"}}
                onClick={()=>handleLoadFromCloud(pinInput)}>
                {cloudLoading ? "로딩중..." : "연결하기"}
              </button>
              <button style={{flex:1,background:"#1e1e1e",color:"#aaa",border:"1px solid #333",borderRadius:8,padding:"12px",fontWeight:600,fontSize:14,cursor:"pointer"}}
                onClick={()=>{setShowPinModal(false);setPinInput("");}}>
                취소
              </button>
            </div>
            {pin && <button style={{width:"100%",background:"transparent",border:"1px solid #3a1a1a",color:"#f66",borderRadius:8,padding:"10px",marginTop:8,fontSize:12,cursor:"pointer"}}
              onClick={()=>{localStorage.removeItem("mdw_pin_v7");setPin("");setCloudList([]);setShowPinModal(false);showToast("PIN 초기화됨");}}>
              PIN 초기화 (클라우드 연결 해제)
            </button>}
          </div>
        </div>
      )}

      {toast && (
        <div style={{position:"fixed",bottom:24,left:"50%",transform:"translateX(-50%)",background:"#1a3a1a",border:"1px solid #2a5a2a",color:"#9fdf9f",padding:"12px 20px",borderRadius:10,fontSize:13,fontWeight:600,boxShadow:"0 4px 16px rgba(0,0,0,0.4)",zIndex:1001}}>
          {toast}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
